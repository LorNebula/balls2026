[project]
name = "eve-ascii"
version = "0.1.0"
description = "EVE-like ASCII terminal game (travel MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
]

[project.scripts]
eve-ascii = "eve_ascii.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
