[project]
name = "lsl-online"
version = "0.1.0"
description = "LSL ONLINE — ASCII terminal space trading game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "pygame-ce>=2.5.0",
]

[project.scripts]
lsl-online = "lsl_online.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
